name: Docs Sync & zh-TW Translate

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

concurrency:
  group: docs-sync
  cancel-in-progress: false

jobs:
  sync-and-translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-docs-sync-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-docs-sync-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Setup upstream
        run: |
          git remote add upstream https://github.com/openclaw/openclaw.git || true
          git fetch --no-tags upstream main

      - name: Sync docs from upstream
        shell: bash
        run: |
          set -euo pipefail

          BASE="$(git merge-base HEAD upstream/main)"

          mapfile -t changed_docs < <(
            git diff --name-only --diff-filter=ACMR "$BASE" upstream/main -- docs \
              | grep -Ev '^docs/zh-TW/' || true
          )

          mapfile -t deleted_docs < <(
            git diff --name-only --diff-filter=D "$BASE" upstream/main -- docs \
              | grep -Ev '^docs/zh-TW/' || true
          )

          if (( ${#changed_docs[@]} > 0 )); then
            git checkout upstream/main -- "${changed_docs[@]}"
          fi

          if (( ${#deleted_docs[@]} > 0 )); then
            rm -f "${deleted_docs[@]}"
          fi

          for src in "${deleted_docs[@]}"; do
            if [[ "$src" =~ ^docs/(zh-CN|ja-JP|zh-TW)/ ]]; then
              continue
            fi
            rel="${src#docs/}"
            rm -f "docs/zh-TW/${rel}"
          done

      - name: Run Translation Script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pnpm run docs:translate

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(i18n): sync upstream docs and update zh-TW"
          git push origin HEAD:main
